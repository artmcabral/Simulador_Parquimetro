
<!DOCTYPE html>
<html lang="pt-BR">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Simulador de Parquímetro</title>
    <link rel="stylesheet" href="styles.css">
</head>
<body>

    <div class="container">
        <h1>Parquímetro</h1>
        <p class="subtitulo">Simule seu tempo de estacionamento</p>

        <div class="tabela">
            <h3>Tabela de Valores</h3>
            <p>R$ 1,00 - 30 minutos</p>
            <p>R$ 1,75 - 60 minutos</p>
            <p>R$ 3,00 - 120 minutos</p>
        </div>

        <form id="form-parquimetro">
            <label for="valor">Valor inserido (R$)</label>
            <input
                type="number"
                id="valor"
                min="0"
                step="0.01"
                placeholder="Ex: 2.00"
                required
            >

            <button type="submit">Calcular Tempo</button>
        </form>

        <div id="resultado" class="resultado"></div>
    </div>

    <script src="script.js"></script>
</body>
</html>
